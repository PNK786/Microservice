spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
   env:
    enabled: true

info:
  app:
    name: "gatewayServer"
    description: "Eazy Bank gateway Server"
    version: "1.0.0"
